kind = "web"
previewPath = "/"
title = "AI Teacher Platform"
version = "1.0.0"
id = "artifacts/teacher-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23870

[services.development]
run = "pnpm --filter @workspace/teacher-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/teacher-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/teacher-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23870"
BASE_PATH = "/"
